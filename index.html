<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>天赋图谱 | Talent Atlas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@200;500;900&family=Playfair+Display:italic&display=swap');
        body { background: #000; color: #fff; font-family: 'Noto+Sans+SC', sans-serif; margin: 0; overflow: hidden; }
        
        .gradient-bg { 
            background: radial-gradient(circle at 50% -10%, #1e3a8a 0%, #000 60%);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .main-title {
            letter-spacing: 0.5em;
            background: linear-gradient(180deg, #fff 0%, rgba(255,255,255,0.5) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }

        /* 核心动效：流光按钮 */
        .cta-button {
            position: relative;
            background: #ffffff;
            color: #000;
            overflow: hidden;
            font-weight: 600;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 0 0 0 rgba(255,255,255,0);
        }

        /* 呼吸光圈动画 */
        .btn-glow {
            animation: pulse-glow 3s infinite;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(255, 255, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }

        /* 流光掠影效果 */
        .cta-button::after {
            content: "";
            position: absolute;
            top: -50%;
            left: -60%;
            width: 20%;
            height: 200%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.8) 50%, rgba(255,255,255,0) 100%);
            transform: rotate(30deg);
            animation: shine 4s infinite;
        }

        @keyframes shine {
            0% { left: -60%; }
            20% { left: 120%; }
            100% { left: 120%; }
        }

        .cta-button:active {
            transform: scale(0.95);
        }

        /* 验证按钮：能量蓝色光感 */
        .verify-btn {
            background: #2563eb;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .verify-btn:active {
            transform: translateY(2px);
            filter: brightness(1.2);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
        }

        .fade-in { animation: fadeIn 1s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="gradient-bg">
    <div id="root" class="w-full max-w-md mx-auto flex flex-col h-full p-8">
        
        <div id="home-view" class="flex flex-col h-full fade-in text-center">
            <header class="pt-10 mb-8">
                <h1 class="main-title text-4xl mb-2 ml-4">天赋图谱</h1>
                <div class="text-[10px] text-white/40 italic mb-6 tracking-[0.2em] font-serif">
                    Curated by <span class="text-white/70">zhihuixu</span>
                </div>
                <div class="h-[1px] w-8 bg-blue-500/50 mx-auto"></div>
            </header>

            <div class="mb-10">
                <button onclick="startAuth()" class="cta-button btn-glow w-full py-5 rounded-2xl text-base tracking-[0.6em] uppercase">
                    开启觉醒之旅
                </button>
                <div class="mt-4 flex justify-between px-2 text-[9px] text-white/30 tracking-[0.3em] font-medium uppercase">
                    <span>90 Questions</span>
                    <span>v2.0 Beta Edition</span>
                </div>
            </div>

            <section class="flex-1 overflow-y-auto space-y-4 mb-6">
                <div class="glass-card p-5 rounded-2xl text-left">
                    <h4 class="text-blue-400 text-[10px] font-bold mb-2 tracking-widest uppercase">核心价值</h4>
                    <p class="text-[12px] leading-relaxed text-white/80 font-light">
                        通过 zhihuixu 构建的动态逻辑引擎，深度探测你的潜在特长，生成独一无二的赛博身份标识。
                    </p>
                </div>
            </section>

            <footer class="pt-6 border-t border-white/10 pb-4">
                <div class="text-[9px] text-white/20 leading-relaxed space-y-2 text-center">
                    <p>【免责声明】结果基于统计模型，仅供自我探索参考。</p>
                    <p class="opacity-40">Created by zhihuixu | © 2026</p>
                </div>
            </footer>
        </div>
    </div>

    <script>
        function render(content) { document.getElementById('root').innerHTML = content; }

        function startAuth() {
            render(`
                <div class="flex-1 flex flex-col justify-center fade-in text-center p-4">
                    <h2 class="text-xs tracking-[0.5em] mb-16 text-blue-500 uppercase font-bold">Identity Access</h2>
                    <div class="space-y-6">
                        <input id="code-input" type="text" placeholder="输入10位激活码" 
                            class="bg-transparent border-b-2 border-blue-900 focus:border-blue-500 w-full py-4 text-center text-xl tracking-[0.2em] outline-none transition-all placeholder:text-white/10">
                        <p class="text-[9px] text-white/20 tracking-widest">请通过 zhihuixu 官方渠道获取通行凭证</p>
                    </div>
                    <button onclick="showQuiz(0)" class="verify-btn mt-20 w-full py-4 text-white rounded-xl text-sm font-bold tracking-[0.6em] shadow-xl shadow-blue-900/30">
                        验证身份
                    </button>
                    <button onclick="location.reload()" class="mt-10 text-[9px] text-white/20 tracking-widest hover:text-white uppercase underline underline-offset-8 transition-all">← BACK TO HOME</button>
                </div>
            `);
        }

        // 占位逻辑
        function showQuiz(idx) {
            render(`
                <div class="flex-1 flex flex-col justify-center text-left p-4 fade-in">
                    <div class="text-[8px] text-blue-500 mb-8 tracking-[0.4em] font-mono uppercase font-bold">Phase 01 / 90</div>
                    <h2 class="text-2xl font-light leading-snug mb-16 text-white italic">你的灵魂动力源更像是？</h2>
                    <div class="space-y-4 text-center">
                        <button onclick="next()" class="w-full py-6 bg-white/5 border border-white/10 rounded-2xl text-xs tracking-[0.2em] hover:bg-white hover:text-black transition-all px-8 text-left">精密运行的冷逻辑</button>
                        <button onclick="next()" class="w-full py-6 bg-white/5 border border-white/10 rounded-2xl text-xs tracking-[0.2em] hover:bg-white hover:text-black transition-all px-8 text-left">滚烫跳跃的直觉</button>
                    </div>
                </div>
            `);
        }
        function next() { alert('激活成功！主理人 zhihuixu 正在为您加载核心算法...'); location.reload(); }
    </script>
</body>
</html>
