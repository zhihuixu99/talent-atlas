<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>天赋图谱 | Talent Atlas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@200;400;500&display=swap');
        body { background: #000; color: #fff; font-family: 'Noto+Sans+SC', sans-serif; margin: 0; overflow-x: hidden; }
        .gradient-bg { 
            background: radial-gradient(circle at 50% -10%, #1e293b 0%, #000 70%);
            height: 100vh; /* 强制首屏高度 */
            display: flex;
            flex-direction: column;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .glow-button {
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
            transition: all 0.4s ease;
        }
        .animate-float { animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    </style>
</head>
<body class="gradient-bg">
    <div id="root" class="w-full max-w-md mx-auto flex flex-col h-full p-6">
        <div id="home-view" class="flex flex-col h-full">
            
            <header class="pt-6 mb-8 text-center">
                <h1 style="letter-spacing: 0.3em;" class="text-3xl font-extralight mb-2 italic">天赋图谱</h1>
                <p class="text-white/30 text-[9px] tracking-[0.5em] uppercase">Find Your Inner Code</p>
            </header>

            <div class="mb-10">
                <button onclick="startAuth()" class="glow-button w-full py-5 border border-white/20 rounded-full text-sm tracking-[0.8em] font-light bg-white/5 animate-float">
                    开启觉醒
                </button>
                <div class="mt-4 flex justify-between px-2 text-[8px] text-white/20 tracking-widest uppercase">
                    <span>⏱ 12-15 Mins</span>
                    <span>📊 90 Questions</span>
                </div>
            </div>

            <section class="flex-1 overflow-y-auto space-y-3 pb-6 px-1">
                <div class="glass-card p-4 rounded-xl">
                    <p class="text-[12px] leading-relaxed text-white/70">
                        <span class="text-blue-400 mr-2">●</span><strong>核心溢价：</strong>锁定你做起来毫不费力且具备爆发力的天赋。
                    </p>
                </div>
                <div class="glass-card p-4 rounded-xl">
                    <p class="text-[12px] leading-relaxed text-white/70">
                        <span class="text-purple-400 mr-2">●</span><strong>决策本能：</strong>理解你在复杂环境下的无意识行为逻辑。
                    </p>
                </div>
                <div class="glass-card p-4 rounded-xl">
                    <p class="text-[12px] leading-relaxed text-white/70">
                        <span class="text-green-400 mr-2">●</span><strong>身份视觉：</strong>生成基于访谈数据驱动的个人天赋 ID 卡。
                    </p>
                </div>
            </section>

            <footer class="pt-4 border-t border-white/5 pb-6">
                <p class="text-[8px] text-white/10 leading-relaxed text-center italic">
                    测试基于心理统计模型推演，结果仅供自我探索参考。
                </p>
            </footer>
        </div>
    </div>

    <script>
        // 保持之前的逻辑不变
        function startAuth() {
            document.getElementById('root').innerHTML = `
                <div class="flex-1 flex flex-col justify-center text-center p-4">
                    <h2 class="text-[10px] tracking-[0.5em] mb-12 text-white/40 uppercase italic">Access Identity</h2>
                    <input id="code-input" type="text" placeholder="输入10位激活码" class="bg-transparent border-b border-white/10 w-full py-6 text-center text-xl tracking-[0.5em] outline-none focus:border-white transition-all placeholder:text-white/5">
                    <button onclick="showQuiz(0)" class="mt-20 text-[10px] tracking-[0.6em] text-white/40 hover:text-white uppercase underline underline-offset-[16px]">Confirm →</button>
                </div>
            `;
        }

        const questions = [
            { type: 'choice', q: '你的灵魂动力源更像是？', a: '精密运行的冷逻辑', b: '滚烫跳跃的直觉' },
            { type: 'choice', q: '在人群中，你更习惯？', a: '透明的观察者', b: '发光的参与者' }
        ];

        function showQuiz(idx) {
            const q = questions[idx % questions.length];
            document.getElementById('root').innerHTML = `
                <div class="flex-1 flex flex-col justify-center text-left p-4">
                    <div class="text-[8px] text-white/20 mb-8 tracking-widest uppercase font-mono">STEP ${idx + 1} / 90</div>
                    <h2 class="text-xl font-light leading-relaxed mb-16">${q.q}</h2>
                    <div class="space-y-4">
                        <button onclick="next(${idx})" class="w-full py-5 border border-white/10 rounded-xl text-xs tracking-widest hover:bg-white/10 transition-all">${q.a}</button>
                        <button onclick="next(${idx})" class="w-full py-5 border border-white/10 rounded-xl text-xs tracking-widest hover:bg-white/10 transition-all">${q.b}</button>
                    </div>
                </div>
            `;
        }

        function next(idx) {
            if(idx < 89) showQuiz(idx + 1);
            else showResult();
        }

        function showResult() {
            document.getElementById('root').innerHTML = `<div class="flex-1 flex flex-col items-center justify-center p-4"><h3 class="text-blue-400 tracking-widest text-sm">测评完成</h3><p class="text-white/30 text-xs mt-4">正在生成您的赛博身份卡...</p></div>`;
        }
    </script>
</body>
</html>
