<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>天赋图谱 | Talent Atlas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@200;500;900&display=swap');
        body { background: #000; color: #fff; font-family: 'Noto+Sans+SC', sans-serif; margin: 0; overflow: hidden; }
        .gradient-bg { background: radial-gradient(circle at 50% -10%, #1e3a8a 0%, #000 70%); height: 100vh; display: flex; flex-direction: column; }
        
        /* 动效：按钮与流光 */
        .cta-button { position: relative; background: #fff; color: #000; font-weight: 600; overflow: hidden; transition: 0.3s; animation: pulse-glow 3s infinite; }
        @keyframes pulse-glow { 0% { box-shadow: 0 0 0 0 rgba(255,255,255,0.4); } 70% { box-shadow: 0 0 0 15px rgba(255,255,255,0); } 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); } }
        .cta-button::after { content: ""; position: absolute; top: -50%; left: -60%; width: 20%; height: 200%; background: linear-gradient(to right, rgba(255,255,255,0), rgba(255,255,255,0.8), rgba(255,255,255,0)); transform: rotate(30deg); animation: shine 4s infinite; }
        @keyframes shine { 0% { left: -60%; } 20% { left: 120%; } 100% { left: 120%; } }

        /* 卡片动效 */
        .card-inner { transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; cursor: pointer; }
        .glass-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(25px); backface-visibility: hidden; position: absolute; inset: 0; }
        
        /* 动态背景 */
        .bg-dots { background-image: radial-gradient(rgba(255,255,255,0.15) 1px, transparent 1px); background-size: 20px 20px; animation: move-bg 15s linear infinite; }
        .bg-grid { background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 30px 30px; animation: move-bg 20s linear infinite; }
        @keyframes move-bg { from { background-position: 0 0; } to { background-position: 100px 100px; } }

        .shake { animation: shake 0.3s; }
        @keyframes shake { 0%,100% { transform:translateX(0); } 25% { transform:translateX(-5px); } 75% { transform:translateX(5px); } }
        .fade-in { animation: fadeIn 0.6s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="gradient-bg">
    <div id="root" class="w-full max-w-md mx-auto flex flex-col h-full p-8"></div>

<script>
    const validCodes = ["XU88888888", "ZHUIHUI666", "ADMIN123"];
    
    const archetypes = {
        "LOGIC_ARCHITECT": { title: "逻辑架构师", tags: ["#底层闭环", "#精准定损"], desc: "你天生对‘低效率’有生理性厌恶。你的潜质在于：能从乱麻中精准抽出关键线索。在草台班子的世界里，你的逻辑闭环极其昂贵。", truth: "处理器频率过高带来的孤独感是你的常态。", quote: "你不是爱找茬，你是真受不了这世界乱糟糟。", color: "#3b82f6", visual: "bg-grid" },
        "WILD_ALCHEMIST": { title: "野生炼金术士", tags: ["#脑洞漏风", "#跨界重组"], desc: "你不是在创造美，你只是从未来的废墟里搬运了光。你的天赋是‘跨界联想’，能把不沾边的东西拼出火花。", truth: "大脑里有无数个平行宇宙，让你有时显得行动滞后。", quote: "这世上本没有路，想的人多了，我就造了一条。", color: "#8b5cf6", visual: "bg-dots" },
        "EMOTION_SENSOR": { title: "高频传感器", tags: ["#情绪镜像", "#超感官"], desc: "进屋不用看脸也能察觉气压。这种‘人间路由器’体质是你最强的人脉杠杆，能瞬间拆解复杂的人性博弈。", truth: "学会‘关机’是你的必修课，否则情绪垃圾会烧掉你的 CPU。", quote: "你不是没主见，你只是太会‘读空气’了。", color: "#10b981", visual: "bg-dots" },
        "AMBITIOUS_PATHFINDER": { title: "野心开拓者", tags: ["#结果导向", "#破局者"], desc: "规则只是参考。在没有路的地方，你这种不按常理出牌的本能极度稀缺。你关心的是这事儿成不成、值不值。", truth: "别装了，那些弯弯绕绕的情怀打动不了你，你只要结果。", quote: "谈感情伤钱，谈逻辑太慢，直接看结果。", color: "#f59e0b", visual: "bg-grid" },
        "SYSTEM_PURGATORY": { title: "规则解构者", tags: ["#降维打击", "#死磕本质"], desc: "你擅长把庞大项目拆成补丁，精准找到系统重启的‘开关’。你这种不带感情的客观，是处理烂摊子的利器。", truth: "你对世俗人情的迟钝，是为了保护逻辑纯净而过滤掉的噪音。", quote: "直接把底层的代码逻辑跑给我看。", color: "#2563eb", visual: "bg-grid" },
        "VIBE_DESIGNER": { title: "氛围捕捉位", tags: ["#美学直觉", "#细节控"], desc: "你对‘高级感’有着动物般的直觉。这种‘审美霸权’让你在平庸的商业世界里，自带一种昂贵的稀缺性。", truth: "你对丑的东西会感到物理不适，审美成本比别人高得多。", quote: "如果你不能让它变美，至少别让它变丑。", color: "#d946ef", visual: "bg-dots" },
        "SOUL_SHELTER": { title: "灵魂避难所", tags: ["#极致包容", "#治愈系"], desc: "你有一种魔力，能让别人在你面前说真话。你不评判，只接纳。这种信任感让你在资源交换中拥有隐秘支配权。", truth: "忙着修补别人的破碎时，别忘了回头打扫自己的房间。", quote: "在我这里，你可以脱掉所有社会性的伪装。", color: "#059669", visual: "bg-dots" },
        "WAR_MACHINE": { title: "高压处理器", tags: ["#极端冷静", "#单点突破"], desc: "越乱的环境你越值钱。当所有人都在焦虑时，你会进入一种冷血的冷静。你是处理大危机的天然定海神针。", truth: "你不是没感情，只是觉得在解决问题前，感情是负担。", quote: "子弹飞过来的时候，我只想看清轨迹。", color: "#dc2626", visual: "bg-grid" },
        "PATTERN_WATCHER": { title: "规律观测员", tags: ["#预见性", "#大局观"], desc: "你总能比别人早三秒预测走向。这种‘先知感’让你能避开大多数人必踩的坑，在时代的窄门里提前布局。", truth: "清醒地看着悲剧发生却无法阻止，是你最大的宿命感。", quote: "三年前埋下的种子，今天必须开花。", color: "#6366f1", visual: "bg-dots" },
        "SKEPTIC_THINKER": { title: "硬核怀疑论者", tags: ["#反共识", "#批判思维"], desc: "你天生反骨，别人都信的东西你偏要拆开看。这种清醒让你在集体狂热中避免成为代价。", truth: "你的怀疑不是为了杠，而是因为太想找到绝对稳固的真相。", quote: "大多数人点头时，我习惯退后一步。", color: "#475569", visual: "bg-grid" },
        "RESOURCE_KNOT": { title: "资源绳结", tags: ["#情报中枢", "#价值对齐"], desc: "你是活的人格地图。你不需要拥有资源，只需要重新排列组合它们，就能创造巨大的杠杆效应。", truth: "你害怕失去连接，所以不停地交换信息，哪怕很疲惫。", quote: "我知道谁有你要的答案。", color: "#fbbf24", visual: "bg-dots" },
        "TRANSLATOR": { title: "跨维翻译官", tags: ["#信息对齐", "#沟通大师"], desc: "你能把专家的废话翻译成老板听得懂的钱。这种跨维沟通能力，是任何高效组织的秘密心脏。", truth: "在不同人面前有不同面孔，有时也会忘了哪个是真的你。", quote: "我是在对齐我们各自的现实。", color: "#ec4899", visual: "bg-dots" },
        "SILENT_OPERATOR": { title: "幕后操盘手", tags: ["#极致稳健", "#深藏不露"], desc: "你讨厌聚光灯。你喜欢在暗处拨动开关。你的耐力让你能在所有人撤退时，收割最丰硕的果实。", truth: "你的野心比谁都大，只是藏在了波澜不惊的耐心下。", quote: "等风来，不如在无风的地方挖一口井。", color: "#1e293b", visual: "bg-grid" },
        "GARDENER": { title: "系统修剪师", tags: ["#长期主义", "#微小迭代"], desc: "你不信爆发增长，只信每天进步1%。这种慢功夫，是抵抗这个焦虑时代最硬的盾牌。", truth: "你对‘快’有本能恐惧，觉得没根的东西不踏实。", quote: "时间是最好的过滤器。", color: "#65a30d", visual: "bg-dots" },
        "ZERO_CRUSADER": { title: "零号冲锋手", tags: ["#绝对执行", "#无畏感"], desc: "你是不需要激励的发动机。只要目标明确，你就没有损耗。你是团队在拓荒期最渴望的尖刀。", truth: "你最怕闲着。一旦停下来，就会陷入自我怀疑。", quote: "告诉目标在哪，然后看我把它拿回来。", color: "#f43f5e", visual: "bg-grid" },
        "BALANCE_SEEKER": { title: "平衡寻找者", tags: ["#中庸之道", "#全局博弈"], desc: "你追求和谐。你的潜质在于多方博弈中寻找平衡点，让所有人都能活着下桌。", truth: "常被误解为没主见，其实是为了保护那个易碎的大盘子。", quote: "共存才是文明的艺术。", color: "#94a3b8", visual: "bg-dots" }
    };

    function render(c) { document.getElementById('root').innerHTML = c; }

    function showHome() {
        render(`
            <div class="flex flex-col h-full fade-in text-center">
                <header class="pt-8 mb-10">
                    <h1 class="text-4xl font-black mb-2 tracking-[0.4em] uppercase">天赋图谱</h1>
                    <div class="text-[10px] text-white/30 tracking-[0.2em] italic">Curated by zhihuixu</div>
                </header>
                <div class="flex-1 px-4 flex flex-col justify-center">
                    <p class="text-xl font-light leading-relaxed mb-12">
                        抛弃标签，<span class="text-blue-500 font-bold">拆解底层动机。</span><br>
                        发现那些被你忽略的<span class="text-blue-500 font-bold">昂贵潜质。</span>
                    </p>
                    <div class="flex justify-center gap-3 mb-12">
                        <span class="bg-white/5 border border-white/10 px-4 py-2 rounded-full text-[10px] tracking-widest text-white/50">⏱ 15 MINS</span>
                        <span class="bg-white/5 border border-white/10 px-4 py-2 rounded-full text-[10px] tracking-widest text-white/50">📊 90 QUES</span>
                    </div>
                    <button onclick="startAuth()" class="cta-button w-full py-5 rounded-2xl text-base tracking-[0.8em] uppercase">开启觉醒之旅</button>
                </div>
                <footer class="py-8 text-[9px] text-white/20 tracking-widest uppercase">
                    © 2026 Designed by zhihuixu
                </footer>
            </div>
        `);
    }

    function startAuth() {
        render(`
            <div class="flex-1 flex flex-col justify-center p-4 text-center fade-in">
                <h2 class="text-[10px] tracking-[0.5em] mb-20 text-blue-500 font-bold uppercase">Identity Access</h2>
                <div id="input-container" class="space-y-8">
                    <input id="code-input" type="text" placeholder="输入10位激活码" class="bg-transparent border-b border-white/20 focus:border-blue-500 w-full py-4 text-center text-xl tracking-[0.3em] outline-none transition-all placeholder:text-white/10 uppercase">
                    <p class="text-[10px] text-white/20 tracking-widest">请向主理人 zhihuixu 获取通行凭证</p>
                </div>
                <button onclick="verify()" class="mt-24 w-full py-5 bg-blue-600 text-white rounded-2xl text-sm font-bold tracking-[0.5em] shadow-2xl active:scale-95 transition-all">验证身份</button>
                <button onclick="showHome()" class="mt-10 text-[9px] text-white/30 uppercase tracking-[0.2em]">← Return</button>
            </div>
        `);
    }

    function verify() {
        const i = document.getElementById('code-input');
        const v = i.value.trim().toUpperCase();
        if(!v || !validCodes.includes(v)) {
            i.classList.add('shake');
            alert(!v ? "⚠️ 请输入激活码" : "❌ 凭证失效或不存在");
            setTimeout(()=>i.classList.remove('shake'), 300);
            return;
        }
        showQuiz(0);
    }

    function showQuiz(idx) {
        const p = Math.round(((idx+1)/90)*100);
        render(`
            <div class="flex-1 flex flex-col justify-center text-left p-4 fade-in">
                <div class="w-full h-[2px] bg-white/10 mb-12"><div class="h-full bg-blue-500 transition-all duration-700" style="width:${p}%"></div></div>
                <div class="text-[9px] text-blue-500 mb-6 tracking-[0.3em] font-bold">PHASE ${idx+1} / 90</div>
                <h2 class="text-2xl font-light mb-20 text-white leading-snug">如果必须要放弃一个，你更不能接受？</h2>
                <div class="space-y-5">
                    <button onclick="handleNext(${idx})" class="w-full py-6 bg-white/5 border border-white/10 rounded-2xl text-xs tracking-widest hover:bg-white hover:text-black transition-all px-8 text-left">A. 失去对事物的掌控力</button>
                    <button onclick="handleNext(${idx})" class="w-full py-6 bg-white/5 border border-white/10 rounded-2xl text-xs tracking-widest hover:bg-white hover:text-black transition-all px-8 text-left">B. 失去与人的深度连接</button>
                </div>
            </div>
        `);
    }

    function handleNext(idx) {
        if(idx < 3) showQuiz(idx + 1); // 预览版跑3题
        else {
            render(`<div class="flex-1 flex flex-col items-center justify-center"><div class="w-10 h-10 border-2 border-blue-600 border-t-transparent rounded-full animate-spin"></div><p class="mt-8 text-[10px] tracking-[0.4em] text-blue-500 animate-pulse uppercase">Calculating Identity...</p></div>`);
            setTimeout(showResult, 2000);
        }
    }

    function showResult() {
        const keys = Object.keys(archetypes);
        const res = archetypes[keys[Math.floor(Math.random()*keys.length)]];
        render(`
            <div class="flex-1 flex flex-col items-center justify-center p-4 fade-in">
                <div id="card" class="w-full aspect-[4/6] max-w-[320px] relative" style="perspective:1200px;">
                    <div id="card-inner" class="card-inner w-full h-full relative" onclick="flip()">
                        <div class="glass-card rounded-[40px] p-10 flex flex-col items-center overflow-hidden">
                            <div class="absolute inset-0 ${res.visual} opacity-20"></div>
                            <div class="text-[9px] tracking-[0.6em] mb-6 font-bold uppercase relative" style="color:${res.color}">Talent Identity</div>
                            
                            <div class="w-32 h-32 my-8 relative flex items-center justify-center">
                                <div class="absolute inset-0 rounded-full border border-dashed opacity-20 animate-spin" style="border-color:${res.color}; animation-duration:10s"></div>
                                <svg width="60" height="60" viewBox="0 0 100 100" class="animate-pulse">
                                    <polygon points="50,5 95,25 95,75 50,95 5,75 5,25" fill="none" stroke="${res.color}" stroke-width="2" />
                                    <circle cx="50" cy="50" r="15" fill="${res.color}" class="opacity-80" />
                                </svg>
                            </div>

                            <h3 class="text-3xl tracking-[0.3em] font-black mb-6 text-center z-10">${res.title}</h3>
                            <div class="flex flex-wrap justify-center gap-2 mb-8 z-10">
                                ${res.tags.map(t=>`<span class="text-[9px] border border-white/10 bg-black/30 px-3 py-1 rounded-full text-white/60">${t}</span>`).join('')}
                            </div>
                            <p class="mt-auto text-[11px] leading-relaxed text-white/40 italic text-center px-4">“${res.quote}”</p>
                        </div>
                        <div class="glass-card rounded-[40px] p-10 flex flex-col overflow-hidden" style="transform:rotateY(180deg)">
                            <div class="absolute inset-0 ${res.visual} opacity-10"></div>
                            <h4 class="text-[10px] tracking-[0.4em] font-bold mb-8 uppercase" style="color:${res.color}">Deep Analysis</h4>
                            <p class="text-[13px] leading-relaxed text-white/80 font-light mb-8 text-justify">${res.desc}</p>
                            <div class="mt-auto p-5 bg-white/5 rounded-3xl border border-white/5">
                                <p class="text-[9px] text-blue-400 mb-3 font-bold tracking-widest uppercase">主理人寄语</p>
                                <p class="text-[11px] leading-relaxed text-white/50 italic font-light">"${res.truth}"</p>
                            </div>
                        </div>
                    </div>
                </div>
                <p class="mt-10 text-[10px] text-white/20 tracking-[0.4em] uppercase animate-pulse">Tap Card to Flip</p>
                <button onclick="location.reload()" class="mt-8 text-[9px] text-white/10 uppercase tracking-[0.2em] underline underline-offset-8">Restart</button>
            </div>
        `);
    }

    function flip() { const i = document.getElementById('card-inner'); i.style.transform = i.style.transform === 'rotateY(180deg)' ? 'rotateY(0deg)' : 'rotateY(180deg)'; }

    showHome();
</script>
</body>
</html>
