<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Talent Atlas | zhihuixu Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@100;400;900&display=swap');
        body { background: #000; color: #fff; font-family: 'Noto+Sans+SC', sans-serif; overflow: hidden; margin: 0; }
        
        .ambient-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% -20%, #1e3a8a 0%, #000 80%);
            z-index: -1;
        }
        .glow {
            position: absolute; width: 400px; height: 400px;
            background: rgba(30, 58, 138, 0.2);
            filter: blur(120px); border-radius: 50%;
            animation: move 25s infinite alternate;
        }
        @keyframes move { from { transform: translate(-20%, -20%); } to { transform: translate(20%, 20%); } }

        /* 自定义滚动条（用于首页长文本） */
        .home-scroll::-webkit-scrollbar { width: 2px; }
        .home-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); }

        .btn-main {
            background: #fff; color: #000; font-weight: 900; letter-spacing: 0.5em;
            padding: 22px; border-radius: 18px; transition: 0.4s;
            box-shadow: 0 0 40px rgba(255,255,255,0.1);
        }
        .btn-main:active { transform: scale(0.95); }

        .info-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; }
        .disclaimer { font-size: 9px; line-height: 1.6; color: rgba(255,255,255,0.2); }
        
        /* 动效 */
        .slide-in { animation: slideIn 0.6s cubic-bezier(0.23, 1, 0.32, 1) forwards; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="ambient-bg"><div class="glow"></div></div>
    <div id="root" class="w-full max-w-md mx-auto h-full p-6 relative flex flex-col overflow-hidden"></div>

<script>
    const CONFIG = { totalSteps: 90, questionsPath: 'questions.json', codesPath: 'auth/codes.json' };
    let fullBank = null, currentIdx = 0, scores = { L: 0, E: 0, A: 0, V: 0 }, answeredIds = [], history = [], activeCode = "";

    function render(h) { document.getElementById('root').innerHTML = h; }

    async function init() {
        try {
            const res = await fetch(CONFIG.questionsPath);
            fullBank = await res.json();
            showHome();
        } catch(e) { render(`<div class='h-full flex items-center justify-center opacity-30 text-[10px] tracking-[0.5em]'>SYNCING ATLAS...</div>`); }
    }

    function showHome() {
        render(`
            <div class="flex-1 flex flex-col slide-in overflow-hidden">
                <div class="pt-8 pb-6 border-b border-white/10">
                    <div class="flex items-center space-x-2 mb-2">
                        <div class="w-4 h-4 bg-blue-500 rounded-sm"></div>
                        <span class="text-[10px] tracking-[0.4em] font-black uppercase text-blue-400">Chief Product Officer: ZHIHUIXU</span>
                    </div>
                    <h1 class="text-4xl font-black tracking-tighter italic leading-none">TALENT<br>ATLAS <span class="text-white/30 text-2xl">PRO</span></h1>
                </div>

                <div class="flex-1 overflow-y-auto home-scroll py-6 space-y-6">
                    <section>
                        <h3 class="text-[11px] font-bold text-white/40 uppercase tracking-[0.2em] mb-3">01. 测试价值 / Objectives</h3>
                        <p class="text-[13px] text-white/80 leading-relaxed font-light">
                            本测试深度解构个体的“逻辑、情绪、野心、视野”四大元维度。它不仅是一次自我认知的博弈，更是一个帮助你识别潜在职业盲点、社交舒适区以及极端压力下本能反应的科学模型。
                        </p>
                    </section>

                    <section>
                        <h3 class="text-[11px] font-bold text-white/40 uppercase tracking-[0.2em] mb-3">02. 预期说明 / Expectations</h3>
                        <div class="flex items-center space-x-4">
                            <div class="flex-1 p-3 info-card text-center">
                                <div class="text-lg font-bold">90</div>
                                <div class="text-[9px] opacity-40 uppercase tracking-widest">维度题目</div>
                            </div>
                            <div class="flex-1 p-3 info-card text-center">
                                <div class="text-lg font-bold">~15</div>
                                <div class="text-[9px] opacity-40 uppercase tracking-widest">预计分钟</div>
                            </div>
                        </div>
                    </section>

                    <section class="disclaimer">
                        <h3 class="text-[10px] font-bold text-white/20 uppercase tracking-[0.2em] mb-2">03. 免责声明 / Disclaimer</h3>
                        本测评结果基于特定算法逻辑生成，仅供内部人才研究与自我反思参考。测评不代表心理医疗诊断，主理人及开发团队不对因测评结论引发的任何个人职业决策或心理状态变动承担法律责任。
                    </section>
                </div>

                <div class="pt-6 border-t border-white/10">
                    <p class="text-[11px] text-center italic text-blue-300 mb-6 tracking-widest">“愿你在数据的尽头，遇见最纯粹的自己。”</p>
                    <button onclick="showAuth()" class="btn-main w-full text-[11px] uppercase mb-4">开始核销身份</button>
                    <div class="text-center text-[8px] text-white/10 tracking-[0.3em] uppercase">Built for Internal Elite Testing Only</div>
                </div>
            </div>
        `);
    }

    // 保持之前的 showAuth, handleVerify, startQuiz 等逻辑不变...
    // 此处为了简洁省略，实际代码中需保留之前的完整逻辑
    function showAuth() {
        render(`
            <div class="flex-1 flex flex-col justify-center px-4 slide-in">
                <div class="mb-12">
                    <span class="text-[10px] text-blue-400 tracking-[0.5em] uppercase font-bold">Security Check</span>
                    <h2 class="text-2xl font-light mt-2 tracking-tight italic">请输入核销序列号</h2>
                </div>
                <input id="authInput" type="text" placeholder="---- ---- ----" class="bg-transparent border-b border-white/10 w-full py-6 text-2xl tracking-[0.1em] outline-none mb-12 uppercase focus:border-blue-500 transition-all font-mono">
                <button onclick="handleVerify()" class="py-5 bg-blue-600 rounded-2xl font-black tracking-[0.4em] text-[11px] shadow-xl shadow-blue-900/40 active:scale-95 transition-transform uppercase">Verify & Connect</button>
                <button onclick="showHome()" class="mt-6 text-[9px] opacity-30 uppercase tracking-[0.3em]">Back to Home</button>
            </div>
        `);
    }

    async function handleVerify() {
        const input = document.getElementById('authInput').value.trim().toUpperCase();
        if(!input) return;
        try {
            const res = await fetch(CONFIG.codesPath);
            const data = await res.json();
            if(data.active_codes.includes(input)) {
                activeCode = input;
                const saved = JSON.parse(localStorage.getItem(`progress_${activeCode}`));
                if(saved) { scores = saved.scores; currentIdx = saved.currentIdx; answeredIds = saved.answeredIds; history = saved.history || []; }
                startQuiz();
            } else { alert("❌ 未获得访问授权"); }
        } catch(e) { alert("网络异常"); }
    }

    function startQuiz() {
        let pool = (currentIdx < 30) ? fullBank.baseline : fullBank[`deep_${Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b)}`] || fullBank.baseline;
        const available = pool.filter(q => !answeredIds.includes(q.id));
        const q = available[Math.floor(Math.random() * available.length)] || pool[0];
        render(`
            <div class="flex-1 flex flex-col">
                <div class="h-1 bg-white/5 rounded-full overflow-hidden mb-12">
                    <div class="h-full bg-gradient-to-r from-blue-900 to-cyan-400 transition-all duration-700" style="width:${(currentIdx/CONFIG.totalSteps)*100}%"></div>
                </div>
                <div class="flex justify-between items-center mb-10">
                    <div class="text-[10px] text-blue-400 font-black tracking-[0.2em] uppercase font-mono">STEP ${currentIdx+1} / ${CONFIG.totalSteps}</div>
                    ${currentIdx > 0 ? `<button onclick="undo()" class="opacity-30 text-[9px] border border-white/20 px-3 py-1 rounded-full uppercase">Undo</button>` : ''}
                </div>
                <h2 class="text-2xl font-medium mb-16 leading-snug text-white/90">${q.q}</h2>
                <div class="space-y-3">
                    <button onclick='submit("${q.id}", ${JSON.stringify(q.a.s)})' class="bg-white/5 border border-white/5 p-5 rounded-2xl w-full text-left text-sm hover:bg-white/10 active:scale-95 transition-all">${q.a.t}</button>
                    <button onclick='submit("${q.id}", ${JSON.stringify(q.b.s)})' class="bg-white/5 border border-white/5 p-5 rounded-2xl w-full text-left text-sm hover:bg-white/10 active:scale-95 transition-all">${q.b.t}</button>
                </div>
            </div>
        `);
    }

    function undo() { history.length && (()=>{ const last = history.pop(); for(let k in last) scores[k]-=last[k]; answeredIds.pop(); currentIdx--; startQuiz(); })(); }
    function submit(id, s) { history.push(s); for(let k in s) scores[k]+=s[k]; answeredIds.push(id); currentIdx++; localStorage.setItem(`progress_${activeCode}`, JSON.stringify({ scores, currentIdx, answeredIds, history })); currentIdx < CONFIG.totalSteps ? startQuiz() : showFinalLoading(); }

    function showFinalLoading() {
        render(`<div class="flex-1 flex flex-col items-center justify-center space-y-6"><div class="w-16 h-[1px] bg-blue-500 animate-pulse"></div><p class="text-[10px] tracking-[0.8em] text-blue-400 uppercase">Calculating Soulprint</p></div>`);
        setTimeout(showResult, 2500);
    }

    function drawRadar(canvasId, data) {
        const canvas = document.getElementById(canvasId);
        const ctx = canvas.getContext('2d');
        const center = 80, radius = 60, sides = 4;
        const values = [data.L, data.E, data.A, data.V];
        const maxVal = Math.max(...values, 20);
        ctx.clearRect(0,0,160,160);
        ctx.strokeStyle = 'rgba(255,255,255,0.08)';
        for(let i=1;i<=3;i++){
            ctx.beginPath();
            for(let j=0;j<sides;j++){
                const x = center + radius*(i/3)*Math.cos(j*2*Math.PI/sides - Math.PI/2);
                const y = center + radius*(i/3)*Math.sin(j*2*Math.PI/sides - Math.PI/2);
                j===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
            }
            ctx.closePath();ctx.stroke();
        }
        ctx.beginPath(); ctx.strokeStyle = '#00f2ff'; ctx.fillStyle = 'rgba(0,242,255,0.15)'; ctx.lineWidth = 2;
        values.forEach((v,i) => {
            const r = (v/maxVal)*radius;
            const x = center + r*Math.cos(i*2*Math.PI/sides - Math.PI/2);
            const y = center + r*Math.sin(i*2*Math.PI/sides - Math.PI/2);
            i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
        });
        ctx.closePath();ctx.fill();ctx.stroke();
    }

    function showResult() {
        const sorted = Object.keys(scores).sort((a,b) => scores[b] - scores[a]);
        const typeMap = {
            "LAEV": { t: "铁血统帅", d: "极致的理性扩张者，擅长在复杂规则中建立帝国。" },
            "LAVE": { t: "战略架构师", d: "审视全局，用逻辑编织网络，控制一切变数。" },
            "LVEA": { t: "深空引航员", d: "洞察规律但不执迷权力，是迷雾中的逻辑灯塔。" },
            "LVAE": { t: "冷峻解构者", d: "拆解表象，世界在你眼里只是跳动的底层代码。" },
            "ELAV": { t: "灵魂共鸣者", d: "极强的感性穿透力，触及他人最深处的渴望。" },
            "EVLA": { t: "圣光祭司", d: "用共情维系秩序，在混乱中建立情感避风港。" },
            "EALV": { t: "感性煽动家", d: "深谙人心，用情感作为支点，撬动巨大资源。" },
            "EVAL": { t: "流浪艺术家", d: "拒绝定义，世界是你的实验场，为灵魂共振而活。" },
            "ALEV": { t: "资源掠夺者", d: "目标至上，结果是评价你价值的唯一准则。" },
            "ALVE": { t: "秩序重塑者", d: "推倒旧世界，建立属于你的强力新规则。" },
            "AEVL": { t: "欲望弄潮儿", d: "名利场中游刃有余，精准捕捉阶跃机会。" },
            "AELV": { t: "巅峰攀登者", d: "享受征服快感，每一座高峰都只是阶梯。" },
            "VLEA": { t: "隐世智者", d: "站在时间维度观测，具备近乎神性的预判。" },
            "VELA": { t: "文明观测员", d: "热爱观测人性演变，人类文明是一场实验。" },
            "VALE": { t: "异次元极客", d: "思维跳脱空间，预言荒诞却无比精准。" },
            "VAEL": { t: "虚无执行官", d: "看透结果无意义，行动上具备冷静与纯粹。" }
        };
        const meta = typeMap[sorted.join('')] || typeMap["LAEV"];
        render(`
            <div class="flex-1 flex flex-col items-center justify-center slide-in px-4">
                <div class="w-full bg-white/5 border border-white/10 rounded-[32px] p-8 text-center relative overflow-hidden backdrop-blur-xl">
                    <canvas id="radar" width="160" height="160" class="mx-auto mb-8"></canvas>
                    <h3 class="text-3xl font-black italic tracking-widest mb-4 uppercase">${meta.t}</h3>
                    <p class="text-[14px] leading-relaxed text-white/70 italic font-light mb-8">"${meta.d}"</p>
                    <div class="pt-6 border-t border-white/10 text-[9px] opacity-20 tracking-[0.4em] uppercase">Authorized by zhihuixu</div>
                </div>
                <button onclick="localStorage.clear();location.reload()" class="mt-12 text-[9px] text-white/10 uppercase tracking-widest hover:text-white/40">Exit & Clear Session</button>
            </div>
        `);
        drawRadar('radar', scores);
    }
    init();
</script>
</body>
</html>
