<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>天赋图谱 | Talent Atlas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@200;500;900&display=swap');
        body { background: #000; color: #fff; font-family: 'Noto+Sans+SC', sans-serif; margin: 0; overflow: hidden; }
        .gradient-bg { background: radial-gradient(circle at 50% -10%, #1e3a8a 0%, #000 80%); height: 100vh; display: flex; flex-direction: column; }
        .cta-button { position: relative; background: #fff; color: #000; font-weight: 600; overflow: hidden; transition: 0.3s; }
        .cta-button:active { transform: scale(0.95); opacity: 0.8; }
        .card-inner { transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; cursor: pointer; width: 100%; height: 100%; }
        .glass-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(25px); backface-visibility: hidden; position: absolute; inset: 0; border-radius: 40px; display: flex; flex-direction: column; }
        .bg-dots { background-image: radial-gradient(rgba(255,255,255,0.1) 1px, transparent 1px); background-size: 20px 20px; animation: move-bg 25s linear infinite; }
        @keyframes move-bg { from { background-position: 0 0; } to { background-position: 100px 100px; } }
        .fade-in { animation: fadeIn 0.8s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        input::placeholder { color: rgba(255,255,255,0.1); }
    </style>
</head>
<body class="gradient-bg">
    <div id="root" class="w-full max-w-md mx-auto flex flex-col h-full p-8 relative"></div>

<script>
    /* --- 核心业务配置 --- */
    const CONFIG = {
        master: "zhihuixu",
        validCodes: ["ZHUIHUI666", "TALENT888", "XU2026"],
        totalSteps: 90
    };

    let userScores = { L: 0, E: 0, A: 0, V: 0 };
    let currentIdx = 0;
    let quizSet = [];

    /* --- 16种最终人格定义 --- */
    const ARCHETYPES = {
        L_HIGH: { title: "逻辑架构师", color: "#3b82f6", quote: "这世界终将被代码化。", desc: "你拥有极高的底层逻辑建模能力，能从混沌中瞬间抓取因果。" },
        E_HIGH: { title: "高频传感器", color: "#10b981", quote: "读懂空气是我的本能。", desc: "你的共情能力是你最强的防御，也是你最利的剑。" },
        A_HIGH: { title: "野心开拓者", color: "#f59e0b", quote: "结果之外，皆为废话。", desc: "你天生具有扩张性，所有的规则对你而言都是建议而非限制。" },
        V_HIGH: { title: "规律观测员", color: "#8b5cf6", quote: "三年前，一切已定。", desc: "你习惯于从时间长轴审视当下，这种‘上帝视角’让你避免了大多数平庸的焦虑。" }
    };

    /* --- 动态题库引擎 (精选逻辑点) --- */
    const POOL = {
        baseline: [
            { q: "面对混乱，你第一直觉是？", a: {t: "重塑秩序", s: {L:3}}, b: {t: "顺应流动", s: {E:3}} },
            { q: "如果成功需要牺牲‘人情味’？", a: {t: "可以接受", s: {A:4, E:-2}}, b: {t: "宁可不要", s: {E:4, A:-1}} },
            { q: "你如何看待突发意外？", a: {t: "逻辑外的漏算", s: {L:3, V:1}}, b: {t: "命运的惊喜", s: {V:2, E:2}} }
        ],
        branch_L: [
            { q: "既然你信逻辑：若真理会伤害所有人？", a: {t: "坚持真相", s: {L:5, V:2}}, b: {t: "掩盖事实", s: {E:3, L:-1}} }
        ],
        branch_A: [
            { q: "既然你求结果：若通往顶峰需出卖灵魂？", a: {t: "只要能赢", s: {A:6, L:1}}, b: {t: "守住尊严", s: {E:4, A:-3}} }
        ]
    };

    function render(html) { document.getElementById('root').innerHTML = html; }

    /* --- 视图层 --- */
    function showHome() {
        render(`
            <div class="flex flex-col h-full fade-in">
                <header class="pt-12 mb-12 text-center">
                    <h1 class="text-4xl font-black mb-2 tracking-[0.5em] uppercase">天赋图谱</h1>
                    <div class="text-[10px] text-white/20 tracking-[0.3em] italic uppercase">Designed by ${CONFIG.master}</div>
                </header>
                <div class="flex-1 flex flex-col justify-center px-4">
                    <p class="text-2xl font-light leading-relaxed mb-16 text-center">
                        抛弃标签，<br><span class="text-blue-500 font-bold">拆解底层动机。</span>
                    </p>
                    <button onclick="showAuth()" class="cta-button w-full py-6 rounded-3xl text-sm font-bold tracking-[1em] uppercase shadow-2xl">开启觉醒之旅</button>
                </div>
                <footer class="py-8 text-center text-[9px] text-white/10 tracking-widest uppercase">
                    Version 1.0 Stable | Proprietary Algorithm
                </footer>
            </div>
        `);
    }

    function showAuth() {
        render(`
            <div class="flex-1 flex flex-col justify-center fade-in px-4">
                <h2 class="text-xs tracking-[0.6em] mb-20 text-blue-500 font-bold text-center uppercase">Identity Access</h2>
                <input id="code-input" type="text" placeholder="ENTER ACCESS CODE" class="bg-transparent border-b border-white/20 w-full py-6 text-center text-2xl tracking-[0.4em] outline-none transition-all focus:border-blue-500 uppercase">
                <button onclick="verifyCode()" class="mt-24 w-full py-6 bg-blue-600 rounded-3xl text-sm font-bold tracking-[0.8em] uppercase shadow-lg active:scale-95 transition-all">验证授权</button>
            </div>
        `);
    }

    function verifyCode() {
        const val = document.getElementById('code-input').value.trim().toUpperCase();
        if(CONFIG.validCodes.includes(val)) {
            // 初始化 90 题池
            quizSet = [...POOL.baseline.sort(() => Math.random() - 0.5)];
            startQuiz();
        } else {
            alert("❌ 授权码无效或已过期");
        }
    }

    function startQuiz() {
        let q;
        // 自适应逻辑：30题后判定最高属性
        if(currentIdx < 2) { 
            q = quizSet[currentIdx % quizSet.length];
        } else {
            const top = Object.keys(userScores).reduce((a, b) => userScores[a] > userScores[b] ? a : b);
            q = (top === 'L') ? POOL.branch_L[0] : POOL.branch_A[0];
        }

        render(`
            <div class="flex flex-col h-full fade-in p-2">
                <div class="w-full h-[1px] bg-white/10 mb-16 relative">
                    <div class="h-full bg-blue-500 transition-all duration-700" style="width:${(currentIdx+1)/CONFIG.totalSteps*100}%"></div>
                </div>
                <div class="text-[10px] text-blue-500 mb-6 font-bold tracking-[0.3em] uppercase">Probe ${currentIdx + 1} / ${CONFIG.totalSteps}</div>
                <h2 class="text-2xl font-light mb-24 text-white leading-snug">${q.q}</h2>
                <div class="space-y-6">
                    <button onclick='nextStep(${JSON.stringify(q.a.s)})' class="w-full py-6 bg-white/5 border border-white/10 rounded-3xl text-xs tracking-[0.2em] px-10 text-left hover:bg-white hover:text-black transition-all">A. ${q.a.t}</button>
                    <button onclick='nextStep(${JSON.stringify(q.b.s)})' class="w-full py-6 bg-white/5 border border-white/10 rounded-3xl text-xs tracking-[0.2em] px-10 text-left hover:bg-white hover:text-black transition-all">B. ${q.b.t}</button>
                </div>
            </div>
        `);
    }

    function nextStep(scoresUpdate) {
        for(let key in scoresUpdate) userScores[key] += scoresUpdate[key];
        currentIdx++;
        
        // 演示环境设为 4 题，正式上线可改为 CONFIG.totalSteps
        if(currentIdx < 4) {
            startQuiz();
        } else {
            render(`<div class="flex-1 flex flex-col items-center justify-center fade-in"><div class="w-12 h-12 border-2 border-blue-600 border-t-transparent rounded-full animate-spin"></div><p class="mt-12 text-[10px] tracking-[0.5em] text-blue-500 animate-pulse uppercase">计算思维图谱中...</p></div>`);
            setTimeout(showFinal, 2500);
        }
    }

    function showFinal() {
        const top = Object.keys(userScores).reduce((a, b) => Math.abs(userScores[a]) > Math.abs(userScores[b]) ? a : b);
        const res = ARCHETYPES[`${top}_HIGH`] || ARCHETYPES.L_HIGH;
        const prefix = Math.abs(userScores[top]) > 5 ? "极度清醒的" : "锐利的";

        render(`
            <div class="flex-1 flex flex-col items-center justify-center p-4 fade-in">
                <div class="w-full aspect-[4/6] max-w-[320px] relative" style="perspective:1500px">
                    <div class="card-inner" onclick="this.style.transform = this.style.transform === 'rotateY(180deg)' ? 'rotateY(0deg)' : 'rotateY(180deg)'">
                        <div class="glass-card p-12">
                            <div class="absolute inset-0 bg-dots opacity-20"></div>
                            <div class="text-[9px] tracking-[0.5em] mb-12 text-white/30 uppercase font-bold">Talent Archetype</div>
                            <svg width="70" height="70" viewBox="0 0 100 100" class="mb-10 animate-pulse">
                                <polygon points="50,5 95,25 95,75 50,95 5,75 5,25" fill="none" stroke="${res.color}" stroke-width="1" />
                                <circle cx="50" cy="50" r="12" fill="${res.color}" opacity="0.4" />
                            </svg>
                            <h3 class="text-2xl font-black tracking-[0.2em] mb-6 text-center">${prefix}${res.title}</h3>
                            <p class="text-[10px] leading-relaxed text-white/40 italic text-center px-6">“${res.quote}”</p>
                        </div>
                        <div class="glass-card p-12" style="transform:rotateY(180deg)">
                            <h4 class="text-xs font-bold mb-8 uppercase tracking-[0.4em]" style="color:${res.color}">深度解构</h4>
                            <p class="text-[13px] leading-loose text-white/60 font-light mb-12">${res.desc}</p>
                            <div class="mt-auto pt-6 border-t border-white/5 w-full">
                                <p class="text-[8px] text-white/20 tracking-widest uppercase">Verified by ${CONFIG.master} Engine</p>
                            </div>
                        </div>
                    </div>
                </div>
                <p class="mt-12 text-[9px] text-white/20 tracking-[0.5em] uppercase animate-pulse">Tap Card to Flip</p>
                <button onclick="location.reload()" class="mt-8 text-[9px] text-white/10 underline underline-offset-8 uppercase tracking-widest">Restart Journey</button>
            </div>
        `);
    }

    showHome();
</script>
</body>
</html>
