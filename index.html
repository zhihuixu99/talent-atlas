<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>天赋图谱 | Talent Atlas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@200;500;900&display=swap');
        body { background: #000; color: #fff; font-family: 'Noto+Sans+SC', sans-serif; overflow: hidden; }
        .gradient-bg { background: radial-gradient(circle at 50% -10%, #1e3a8a 0%, #000 85%); height: 100vh; }
        
        /* 核心卡片动画 */
        .card-container { perspective: 1200px; width: 320px; height: 480px; }
        .card-inner { 
            position: relative; width: 100%; height: 100%; 
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); 
            transform-style: preserve-3d; 
        }
        .card-inner.is-flipped { transform: rotateY(180deg); }
        .card-face { 
            position: absolute; inset: 0; backface-visibility: hidden; 
            border-radius: 40px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.03); backdrop-filter: blur(30px);
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px;
        }
        .card-back { transform: rotateY(180deg); }
        
        /* 按钮与进度条 */
        .btn-choice { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); transition: 0.3s; }
        .btn-choice:active { background: #fff; color: #000; }
        .progress-bar { height: 2px; background: #1e3a8a; overflow: hidden; }
        .progress-fill { height: 100%; background: #3b82f6; box-shadow: 0 0 15px #3b82f6; transition: width 0.5s; }
        
        .fade-in { animation: fadeIn 0.8s forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="gradient-bg">
    <div id="root" class="w-full max-w-md mx-auto h-full p-8 relative flex flex-col"></div>

<script>
    // --- 兑换码数据库 ---
    const DB_CODES = ["XU888", "ZHUIHUI666", "ATLAS2024"]; // 你的初始码库
    let currentIdx = 0;
    let scores = { L: 0, E: 0, A: 0, V: 0 };
    let fullBank = null;
    let answeredIds = new Set();

    function render(h) { document.getElementById('root').innerHTML = h; }

    // 初始化：加载题库
    async function init() {
        try {
            const res = await fetch('./questions.json');
            fullBank = await res.json();
            showHome();
        } catch(e) { render(`<div class='text-xs opacity-50 text-center mt-20'>题库加载中... (请确保同级目录下有questions.json)</div>`); }
    }

    function showHome() {
        render(`
            <div class="flex-1 flex flex-col justify-between py-20 fade-in text-center">
                <div>
                    <h1 class="text-4xl font-black tracking-[0.6em] mb-4">天赋图谱</h1>
                    <p class="text-[10px] text-white/30 tracking-[0.4em]">DYNAMIC ATLAS BY ZHIHUIXU</p>
                </div>
                <button onclick="showAuth()" class="w-full py-6 bg-white text-black font-bold rounded-3xl tracking-[1em]">验证授权码</button>
            </div>
        `);
    }

    function showAuth() {
        render(`
            <div class="flex-1 flex flex-col justify-center fade-in">
                <input id="ci" type="text" placeholder="REDEEM CODE" class="bg-transparent border-b border-white/20 w-full py-6 text-center text-2xl tracking-[0.5em] outline-none mb-20 uppercase">
                <button onclick="handleVerify()" class="w-full py-6 bg-blue-600 rounded-3xl font-black tracking-[0.5em]">立即核销</button>
            </div>
        `);
    }

    function handleVerify() {
        const val = document.getElementById('ci').value.toUpperCase();
        let used = JSON.parse(localStorage.getItem('xu_used') || "[]");
        
        if(used.includes(val)) return alert("此码已失效");
        if(DB_CODES.includes(val)) {
            used.push(val);
            localStorage.setItem('xu_used', JSON.stringify(used));
            startQuiz();
        } else { alert("码无效"); }
    }

    function startQuiz() {
        const pool = (currentIdx < 30) ? fullBank.baseline : fullBank.deep_L; // 演示逻辑，后期根据分数选池
        const q = pool[currentIdx % pool.length];

        render(`
            <div class="flex-1 flex flex-col fade-in">
                <div class="progress-bar mb-16"><div class="progress-fill" style="width:${(currentIdx/90)*100}%"></div></div>
                <div class="text-[10px] text-blue-500 font-bold mb-4 uppercase tracking-widest">Step ${currentIdx+1}/90</div>
                <h2 class="text-2xl font-light mb-20 leading-snug">${q.q}</h2>
                <div class="space-y-4">
                    <button onclick="submit(${JSON.stringify(q.a.s)})" class="btn-choice w-full py-6 rounded-2xl text-xs px-8 text-left">${q.a.t}</button>
                    <button onclick="submit(${JSON.stringify(q.b.s)})" class="btn-choice w-full py-6 rounded-2xl text-xs px-8 text-left">${q.b.t}</button>
                </div>
            </div>
        `);
    }

    function submit(s) {
        for(let k in s) scores[k] += s[k];
        currentIdx++;
        if(currentIdx < 90) startQuiz(); else showLoading();
    }

    function showLoading() {
        render(`<div class="flex-1 flex flex-col items-center justify-center animate-pulse"><div class="w-8 h-8 border-2 border-blue-500 border-t-transparent rounded-full animate-spin mb-8"></div><p class="text-[10px] tracking-[0.5em]">正在锁定天赋原型...</p></div>`);
        setTimeout(showFinalResult, 2500);
    }

    function showFinalResult() {
        const top = Object.keys(scores).reduce((a,b)=>scores[a]>scores[b]?a:b);
        const config = {
            L: { t: "逻辑架构师", c: "#3b82f6", d: "你拥有极高的底层逻辑建模能力。" },
            E: { t: "高频传感器", c: "#10b981", d: "你的共情能力是你最利的剑。" }
        }[top] || { t: "野心开拓者", c: "#f59e0b", d: "结果之外，皆为废话。" };

        render(`
            <div class="flex-1 flex flex-col items-center justify-center fade-in">
                <div class="card-container" onclick="this.querySelector('.card-inner').classList.toggle('is-flipped')">
                    <div class="card-inner">
                        <div class="card-face">
                            <div class="absolute inset-0 bg-[radial-gradient(circle_at_50%_0%,rgba(255,255,255,0.05)_0%,transparent_70%)]"></div>
                            <svg width="60" height="60" viewBox="0 0 100 100" class="mb-10 animate-pulse">
                                <polygon points="50,5 95,25 95,75 50,95 5,75 5,25" fill="none" stroke="${config.c}" stroke-width="1.5" />
                                <circle cx="50" cy="50" r="10" fill="${config.c}" opacity="0.6" />
                            </svg>
                            <h3 class="text-2xl font-black tracking-widest mb-4">${config.t}</h3>
                            <p class="text-[10px] text-white/30 italic">点击卡片查看深度解构</p>
                        </div>
                        <div class="card-face card-back p-10">
                            <h4 class="text-xs font-bold mb-8 uppercase tracking-widest" style="color:${config.c}">天赋真相</h4>
                            <p class="text-xs leading-loose text-white/60 text-justify">${config.d}</p>
                            <div class="mt-auto text-[8px] opacity-20 uppercase tracking-[0.4em]">Verified by ZHIHUIXU Algorithm</div>
                        </div>
                    </div>
                </div>
                <p class="mt-12 text-[9px] text-white/20 uppercase tracking-[0.4em]">Tap to flip</p>
            </div>
        `);
    }

    init();
</script>
</body>
</html>
