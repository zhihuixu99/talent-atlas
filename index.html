<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>天赋图谱 | Talent Atlas Pro (Ultra)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@200;500;900&display=swap');
        body { background: #000; color: #fff; font-family: 'Noto+Sans+SC', sans-serif; overflow: hidden; margin: 0; }
        .gradient-bg { background: radial-gradient(circle at 50% -10%, #1e3a8a 0%, #000 85%); height: 100vh; }
        
        .card-container { perspective: 1200px; width: 320px; height: 500px; margin: 10px auto; }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; cursor: pointer; }
        .card-inner.is-flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 32px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.03); backdrop-filter: blur(25px); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; }
        .card-back { transform: rotateY(180deg); background: rgba(255,255,255,0.06); }
        
        .btn-choice { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); transition: 0.3s; border-radius: 16px; padding: 20px 24px; font-size: 13px; text-align: left; line-height: 1.5; outline: none; }
        .btn-choice:active { transform: scale(0.96); background: #fff; color: #000; }
        .progress-bar { height: 2px; background: rgba(255,255,255,0.1); width: 100%; margin-bottom: 30px; }
        .progress-fill { height: 100%; background: #00f2ff; box-shadow: 0 0 15px #00f2ff; transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
        
        .slide-in { animation: slideIn 0.4s ease-out forwards; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
        
        canvas { filter: drop-shadow(0 0 10px rgba(0,242,255,0.3)); }
    </style>
</head>
<body class="gradient-bg">
    <div id="root" class="w-full max-w-md mx-auto h-full p-8 relative flex flex-col"></div>

<script>
    const CONFIG = { totalSteps: 90, questionsPath: 'questions.json', codesPath: 'auth/codes.json' };
    let fullBank = null, currentIdx = 0, scores = { L: 0, E: 0, A: 0, V: 0 }, answeredIds = [], history = [], activeCode = "";

    function render(h) { document.getElementById('root').innerHTML = h; }

    async function init() {
        try {
            const res = await fetch(CONFIG.questionsPath);
            fullBank = await res.json();
            showHome();
        } catch(e) { render(`<div class='h-full flex items-center justify-center opacity-50 text-[10px] tracking-widest uppercase'>量子资源同步中...</div>`); }
    }

    function showHome() {
        render(`<div class="flex-1 flex flex-col justify-between py-16 slide-in text-center"><div class="mt-10"><h1 class="text-4xl font-black tracking-[0.5em] mb-4 italic text-transparent bg-clip-text bg-gradient-to-b from-white to-white/40">天赋图谱</h1><p class="text-[9px] text-white/20 tracking-[0.4em] uppercase font-light">Talent Atlas Ultra v2.0</p></div><button onclick="showAuth()" class="w-full py-6 bg-white text-black font-bold rounded-2xl tracking-[0.8em] text-sm shadow-[0_0_30px_rgba(255,255,255,0.2)] active:scale-95 transition-transform">身份核销</button></div>`);
    }

    function showAuth() {
        render(`<div class="flex-1 flex flex-col justify-center slide-in px-4"><input id="authInput" type="text" placeholder="ENTER SERIAL CODE" class="bg-transparent border-b border-white/20 w-full py-6 text-center text-xl tracking-[0.2em] outline-none mb-16 uppercase focus:border-cyan-400 transition-colors font-light"><button onclick="handleVerify()" class="w-full py-6 bg-blue-600 rounded-2xl font-bold tracking-[0.5em] text-xs shadow-lg shadow-blue-900/40">进入神经网络</button></div>`);
    }

    async function handleVerify() {
        const input = document.getElementById('authInput').value.trim().toUpperCase();
        if(!input) return;
        try {
            const res = await fetch(CONFIG.codesPath);
            const data = await res.json();
            if(data.active_codes.includes(input)) {
                activeCode = input;
                const saved = JSON.parse(localStorage.getItem(`progress_${activeCode}`));
                if(saved) { scores = saved.scores; currentIdx = saved.currentIdx; answeredIds = saved.answeredIds; history = saved.history || []; }
                startQuiz();
            } else { alert("⚠️ 序列号无效"); }
        } catch(e) { alert("网络异常"); }
    }

    function startQuiz() {
        let pool = (currentIdx < 30) ? fullBank.baseline : fullBank[`deep_${Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b)}`] || fullBank.baseline;
        const available = pool.filter(q => !answeredIds.includes(q.id));
        const q = available[Math.floor(Math.random() * available.length)] || pool[0];
        render(`<div class="flex-1 flex flex-col slide-in"><div class="progress-bar"><div class="progress-fill" style="width:${(currentIdx/CONFIG.totalSteps)*100}%"></div></div><div class="flex justify-between items-center mb-8"><div class="text-[10px] text-cyan-400 font-bold tracking-[0.3em] uppercase">Probe ${currentIdx+1} / ${CONFIG.totalSteps}</div>${currentIdx > 0 ? `<button onclick="undo()" class="opacity-30 text-[10px] uppercase tracking-widest">UNDO</button>` : ''}</div><h2 class="text-xl font-medium mb-16 leading-relaxed text-white/90 min-h-[80px]">${q.q}</h2><div class="space-y-4"><button onclick='submit("${q.id}", ${JSON.stringify(q.a.s)})' class="btn-choice w-full">${q.a.t}</button><button onclick='submit("${q.id}", ${JSON.stringify(q.b.s)})' class="btn-choice w-full">${q.b.t}</button></div></div>`);
    }

    function undo() { history.length && (()=>{ const last = history.pop(); for(let k in last) scores[k]-=last[k]; answeredIds.pop(); currentIdx--; startQuiz(); })(); }
    function submit(id, s) { history.push(s); for(let k in s) scores[k]+=s[k]; answeredIds.push(id); currentIdx++; localStorage.setItem(`progress_${activeCode}`, JSON.stringify({ scores, currentIdx, answeredIds, history })); currentIdx < CONFIG.totalSteps ? startQuiz() : showFinalLoading(); }

    function showFinalLoading() {
        render(`<div class="flex-1 flex flex-col items-center justify-center animate-pulse"><div class="w-12 h-12 border-2 border-cyan-500 border-t-transparent rounded-full animate-spin mb-8"></div><p id="loading-tip" class="text-[10px] tracking-[0.6em] text-cyan-400 uppercase font-light text-center">正在解析思维指纹...</p></div>`);
        setTimeout(showResult, 2500);
    }

    function drawRadar(canvasId, data) {
        const canvas = document.getElementById(canvasId);
        const ctx = canvas.getContext('2d');
        const center = 80, radius = 60, sides = 4;
        const labels = ['LOGIC', 'EMOTION', 'AMBITION', 'VISION'];
        const values = [data.L, data.E, data.A, data.V];
        const maxVal = Math.max(...values, 20);

        ctx.clearRect(0, 0, 160, 160);
        ctx.strokeStyle = 'rgba(255,255,255,0.1)';
        for(let i=1; i<=3; i++) {
            ctx.beginPath();
            for(let j=0; j<sides; j++) {
                const x = center + radius * (i/3) * Math.cos(j * 2 * Math.PI / sides - Math.PI/2);
                const y = center + radius * (i/3) * Math.sin(j * 2 * Math.PI / sides - Math.PI/2);
                j===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
            }
            ctx.closePath(); ctx.stroke();
        }

        ctx.beginPath();
        ctx.strokeStyle = '#00f2ff'; ctx.fillStyle = 'rgba(0,242,255,0.2)'; ctx.lineWidth = 2;
        values.forEach((v, i) => {
            const r = (v / maxVal) * radius;
            const x = center + r * Math.cos(i * 2 * Math.PI / sides - Math.PI/2);
            const y = center + r * Math.sin(i * 2 * Math.PI / sides - Math.PI/2);
            i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
        });
        ctx.closePath(); ctx.fill(); ctx.stroke();
        
        ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.font = '8px Arial'; ctx.textAlign = 'center';
        labels.forEach((l, i) => {
            const x = center + (radius+15) * Math.cos(i * 2 * Math.PI / sides - Math.PI/2);
            const y = center + (radius+15) * Math.sin(i * 2 * Math.PI / sides - Math.PI/2);
            ctx.fillText(l, x, y+3);
        });
    }

    function showResult() {
        const sorted = Object.keys(scores).sort((a,b) => scores[b] - scores[a]);
        const typeMap = {
            "LAEV": { t: "铁血统帅", c: "#3b82f6", d: "极致的理性扩张者，擅长在复杂规则中建立帝国。" },
            "LAVE": { t: "战略架构师", c: "#60a5fa", d: "审视全局，用逻辑编织网络，控制一切变数。" },
            "LVEA": { t: "深空引航员", c: "#2563eb", d: "洞察规律但不执迷权力，是迷雾中的逻辑灯塔。" },
            "LVAE": { t: "冷峻解构者", c: "#1d4ed8", d: "拆解表象，世界在你眼里只是跳动的底层代码。" },
            "ELAV": { t: "灵魂共鸣者", c: "#10b981", d: "极强的感性穿透力，触及他人最深处的渴望。" },
            "EVLA": { t: "圣光祭司", c: "#34d399", d: "用共情维系秩序，在混乱中建立情感避风港。" },
            "EALV": { t: "感性煽动家", c: "#059669", d: "深谙人心，用情感作为支点，撬动巨大资源。" },
            "EVAL": { t: "流浪艺术家", c: "#065f46", d: "拒绝定义，世界是你的实验场，为灵魂共振而活。" },
            "ALEV": { t: "资源掠夺者", c: "#f59e0b", d: "目标至上，结果是评价你价值的唯一准则。" },
            "ALVE": { t: "秩序重塑者", c: "#fbbf24", d: "推倒旧世界，建立属于你的强力新规则。" },
            "AEVL": { t: "欲望弄潮儿", c: "#d97706", d: "名利场中游刃有余，精准捕捉阶跃机会。" },
            "AELV": { t: "巅峰攀登者", c: "#b45309", d: "享受征服快感，每一座高峰都只是阶梯。" },
            "VLEA": { t: "隐世智者", c: "#8b5cf6", d: "站在时间维度观测，具备近乎神性的预判。" },
            "VELA": { t: "文明观测员", c: "#a78bfa", d: "热爱观测人性演变，人类文明是一场实验。" },
            "VALE": { t: "异次元极客", c: "#7c3aed", d: "思维跳脱空间，预言荒诞却无比精准。" },
            "VAEL": { t: "虚无执行官", c: "#5b21b6", d: "看透结果无意义，行动上具备冷静与纯粹。" }
        };
        const meta = typeMap[sorted.join('')] || typeMap["LAEV"];
        render(`<div class="flex-1 flex flex-col items-center justify-center slide-in"><div class="card-container" onclick="this.querySelector('.card-inner').classList.toggle('is-flipped')"><div class="card-inner"><div class="card-face"><canvas id="radar" width="160" height="160" class="mb-6"></canvas><h3 class="text-3xl font-black tracking-[0.3em] mb-4 italic">${meta.t}</h3><p class="text-[8px] opacity-20 tracking-[0.4em] uppercase">Talent Fingerprint Verified</p></div><div class="card-face card-back px-10"><h4 class="text-[10px] font-bold mb-8 uppercase tracking-[0.5em]" style="color:#00f2ff">内核解构</h4><p class="text-[13px] leading-relaxed text-white/70 text-justify font-light italic">"${meta.d}"</p><div class="mt-auto pt-8 border-t border-white/5 w-full text-[8px] opacity-20 tracking-[0.2em] uppercase">Auth: ${activeCode}</div></div></div></div><p class="mt-8 text-[9px] text-white/30 tracking-[0.5em] uppercase animate-pulse">点击翻转报告</p><button onclick="localStorage.clear();location.reload()" class="mt-8 opacity-20 text-[9px] uppercase tracking-widest hover:opacity-100">Reset All Data</button></div>`);
        drawRadar('radar', scores);
    }
    init();
</script>
</body>
</html>
